<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工时计费计算器</title>
<style>
  :root{
    --bg:#f4f6fa;
    --card:#ffffff;
    --line:#e2e8f0;
    --text:#1f2937;
    --muted:#6b7280;
    --accent:#2563eb;
    --accent-soft:#eff6ff;
    --err:#dc2626;
    --ok:#059669;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px 16px;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 20px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px;box-shadow:0 1px 3px rgba(16,24,40,.06);margin-bottom:18px;
  }
  h2{font-size:1.05rem;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:.9rem;font-weight:600}
  .hint{font-size:.78rem;color:var(--muted);font-weight:400}
  input{
    width:100%;padding:10px 12px;font-size:1rem;border:1px solid var(--line);
    border-radius:9px;background:#fff;color:var(--text);font-variant-numeric:tabular-nums;
  }
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input.invalid{border-color:var(--err);box-shadow:0 0 0 3px #fee2e2}
  .err{color:var(--err);font-size:.78rem;min-height:1em}
  .total{
    display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;
    gap:8px;background:var(--accent-soft);border:1px solid #bfdbfe;
    border-radius:12px;padding:16px 18px;margin-bottom:16px;
  }
  .total .label{font-weight:700}
  .total .amt{font-size:2rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600;font-size:.85rem}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  .muted{color:var(--muted);font-size:.82rem;margin-top:12px}
  .reset:hover{background:#f8fafc}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .reset{
    margin-top:0;background:#fff;border:1px solid var(--line);border-radius:9px;
    padding:8px 16px;font-size:.9rem;cursor:pointer;color:var(--text);
  }
  .export{
    margin-top:0;background:var(--accent);border:1px solid var(--accent);color:#fff;
    border-radius:9px;padding:8px 16px;font-size:.9rem;cursor:pointer;
  }
  .export:hover{background:#1d4ed8}
  @media (max-width:520px){
    body{padding:16px 12px}
    .total .amt{font-size:1.6rem}
    th,td{padding:8px 4px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>工时计费计算器</h1>
  <p class="sub">输入正常工时、加班工时、时薪与加班倍数，实时计算应付金额（人民币）。</p>

  <div class="card">
    <h2>输入参数</h2>
    <div class="grid">
      <div class="field">
        <label for="normalHours">正常工时 <span class="hint">（小时）</span></label>
        <input id="normalHours" type="number" min="0" step="0.5" value="8" inputmode="decimal">
        <div class="err" id="errNormal"></div>
      </div>
      <div class="field">
        <label for="overtimeHours">加班工时 <span class="hint">（小时）</span></label>
        <input id="overtimeHours" type="number" min="0" step="0.5" value="2" inputmode="decimal">
        <div class="err" id="errOvertime"></div>
      </div>
      <div class="field">
        <label for="rate">时薪 <span class="hint">（元/小时）</span></label>
        <input id="rate" type="number" min="0" step="0.01" value="50" inputmode="decimal">
        <div class="err" id="errRate"></div>
      </div>
      <div class="field">
        <label for="multiplier">加班倍数 <span class="hint">（如 1.5 表示 1.5 倍）</span></label>
        <input id="multiplier" type="number" min="0" step="0.1" value="1.5" inputmode="decimal">
        <div class="err" id="errMultiplier"></div>
      </div>
    </div>
    <div class="actions">
      <button class="reset" type="button" id="resetBtn">恢复默认值</button>
      <button class="export" type="button" id="exportBtn">导出 CSV</button>
    </div>
  </div>

  <div class="card">
    <h2>计算结果</h2>
    <div class="total">
      <span class="label">应付总金额</span>
      <span class="amt" id="totalAmount">¥0.00</span>
    </div>
    <table>
      <thead>
        <tr><th>分项</th><th>计算方式</th><th style="text-align:right">金额（元）</th></tr>
      </thead>
      <tbody>
        <tr><td>正常工时费</td><td id="fNormal">0 小时 × ¥0.00</td><td class="num" id="vNormal">0.00</td></tr>
        <tr><td>加班工时费</td><td id="fOvertime">0 小时 × ¥0.00</td><td class="num" id="vOvertime">0.00</td></tr>
        <tr><td>合计</td><td>正常工时费 + 加班工时费</td><td class="num" id="vTotal">0.00</td></tr>
      </tbody>
    </table>
    <p class="muted" id="status"></p>
  </div>
</div>

<script>
  // 纯计算函数：正常工时费 = 正常工时 × 时薪；加班工时费 = 加班工时 × 时薪 × 加班倍数
  function computePay(normalHours, overtimeHours, rate, multiplier) {
    var normal = normalHours * rate;
    var overtime = overtimeHours * rate * multiplier;
    return {
      normal: normal,
      overtime: overtime,
      total: normal + overtime
    };
  }

  function parseNumber(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (s === '') return { ok: false, value: NaN, message: '请输入数值' };
    var v = Number(s);
    if (!isFinite(v)) return { ok: false, value: NaN, message: '请输入有效数字' };
    if (v < 0) return { ok: false, value: v, message: '数值不能为负数' };
    return { ok: true, value: v, message: '' };
  }

  var FIELDS = [
    { id: 'normalHours', err: 'errNormal' },
    { id: 'overtimeHours', err: 'errOvertime' },
    { id: 'rate', err: 'errRate' },
    { id: 'multiplier', err: 'errMultiplier' }
  ];
  var DEFAULTS = { normalHours: '8', overtimeHours: '2', rate: '50', multiplier: '1.5' };

  function money(n) {
    return '¥' + (Math.round(n * 100) / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function update() {
    var values = {};
    var allOk = true;
    FIELDS.forEach(function (f) {
      var input = document.getElementById(f.id);
      var errEl = document.getElementById(f.err);
      var res = parseNumber(input.value);
      values[f.id] = res.value;
      if (!res.ok) {
        allOk = false;
        input.classList.add('invalid');
        errEl.textContent = res.message;
      } else {
        input.classList.remove('invalid');
        errEl.textContent = '';
      }
    });

    var status = document.getElementById('status');
    if (!allOk) {
      document.getElementById('totalAmount').textContent = '—';
      document.getElementById('vNormal').textContent = '—';
      document.getElementById('vOvertime').textContent = '—';
      document.getElementById('vTotal').textContent = '—';
      document.getElementById('fNormal').textContent = '—';
      document.getElementById('fOvertime').textContent = '—';
      status.textContent = '请修正标红的输入项后再计算（所有数值须为非负数）。';
      return;
    }

    var r = computePay(values.normalHours, values.overtimeHours, values.rate, values.multiplier);
    document.getElementById('totalAmount').textContent = money(r.total);
    document.getElementById('vNormal').textContent = money(r.normal).replace('¥', '');
    document.getElementById('vOvertime').textContent = money(r.overtime).replace('¥', '');
    document.getElementById('vTotal').textContent = money(r.total).replace('¥', '');
    document.getElementById('fNormal').textContent =
      fmt(values.normalHours) + ' 小时 × ' + money(values.rate);
    document.getElementById('fOvertime').textContent =
      fmt(values.overtimeHours) + ' 小时 × ' + money(values.rate) + ' × ' + fmt(values.multiplier) + ' 倍';
    status.textContent = '数据已按输入实时计算，总金额保留两位小数。';
  }

  function fmt(n) {
    return String(Math.round(n * 100) / 100);
  }

  // 生成 CSV 文本（含 UTF-8 BOM，中文表头）
  function buildCSV(values, result, exportedAt) {
    function cell(v) {
      var s = String(v);
      if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    var lines = [];
    lines.push(['正常工时(小时)', '加班工时(小时)', '时薪(元/小时)', '加班倍数',
                '正常工时费(元)', '加班工时费(元)', '应付总金额(元)'].map(cell).join(','));
    lines.push([
      fmt(values.normalHours), fmt(values.overtimeHours), fmt(values.rate), fmt(values.multiplier),
      (Math.round(result.normal * 100) / 100).toFixed(2),
      (Math.round(result.overtime * 100) / 100).toFixed(2),
      (Math.round(result.total * 100) / 100).toFixed(2)
    ].map(cell).join(','));
    lines.push('');
    lines.push(['导出时间', exportedAt].map(cell).join(','));
    return '﻿' + lines.join('\r\n') + '\r\n';
  }

  function exportCSV() {
    var values = {};
    var allOk = true;
    FIELDS.forEach(function (f) {
      var res = parseNumber(document.getElementById(f.id).value);
      values[f.id] = res.value;
      if (!res.ok) allOk = false;
    });
    var status = document.getElementById('status');
    if (!allOk) {
      status.textContent = '存在非法输入，请先修正后再导出 CSV。';
      return;
    }
    var result = computePay(values.normalHours, values.overtimeHours, values.rate, values.multiplier);
    var now = new Date();
    var pad = function (n) { return String(n).length < 2 ? '0' + n : String(n); };
    var stamp = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
                ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    var csv = buildCSV(values, result, stamp);
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '工时计费_' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes()) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 0);
    status.textContent = '已导出 CSV 文件（UTF-8 BOM，中文表头）。';
  }

  FIELDS.forEach(function (f) {
    var el = document.getElementById(f.id);
    el.addEventListener('input', update);
    el.addEventListener('change', update);
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    FIELDS.forEach(function (f) {
      document.getElementById(f.id).value = DEFAULTS[f.id];
    });
    update();
  });

  document.getElementById('exportBtn').addEventListener('click', exportCSV);

  update();
</script>
</body>
</html>
